name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Optional: set a repo secret VITE_USDA_KEY for the full 1,000/hr USDA
          # allowance. Unset → the code falls back to DEMO_KEY. (Inlined into the
          # public bundle at build time; only acceptable for a free per-IP key.)
          VITE_USDA_KEY: ${{ secrets.VITE_USDA_KEY }}
          # Optional: cloud sync (Supabase). Both are public by design (RLS guards the data);
          # unset → the Cloud sync section is hidden. See supabase/migrations/0001_rows.sql.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: node scripts/check-pwa-dist.mjs
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Retry deploy (Pages service can be transiently unavailable)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
