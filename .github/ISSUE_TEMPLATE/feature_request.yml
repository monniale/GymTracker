name: Feature request
description: Suggest a new feature or an improvement to GymTracker.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Describe the problem first: it helps us find the right solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
      placeholder: When I log a workout, I can't …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like GymTracker to solve it?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you have considered.
    validations:
      required: false

  - type: checkboxes
    id: searched
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this has not been requested yet.
          required: true
